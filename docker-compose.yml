# Local and single-host deployment: PostgreSQL, the API and the web app.
# Copy .env.example to .env first. The web app is on http://localhost:8080.
name: outlet-hq

services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-outlet_hq}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
      POSTGRES_DB: ${POSTGRES_DB:-outlet_hq}
    volumes:
      - db-data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U "$$POSTGRES_USER" -d "$$POSTGRES_DB"']
      interval: 5s
      timeout: 3s
      retries: 20

  api:
    build: ./backend
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      NODE_ENV: production
      PORT: 3000
      DATABASE_URL: postgres://${POSTGRES_USER:-outlet_hq}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB:-outlet_hq}
      JWT_SECRET: ${JWT_SECRET:?Set JWT_SECRET in .env}
      CURRENCY: ${CURRENCY:-MYR}
      LOG_LEVEL: info
      # One proxy (the web container's nginx) sits in front.
      TRUST_PROXY_HOPS: 1
      RUN_MIGRATIONS: 'true'
      SEED_DEMO_DATA: ${SEED_DEMO_DATA:-false}
    ports:
      - '${API_PORT:-3000}:3000'

  web:
    build: ./frontend
    restart: unless-stopped
    depends_on:
      api:
        condition: service_healthy
    environment:
      API_UPSTREAM: http://api:3000
    ports:
      - '${WEB_PORT:-8080}:8080'

volumes:
  db-data:
