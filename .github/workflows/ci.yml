name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  api:
    name: API (lint, types, tests, build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: outlet_hq
          POSTGRES_PASSWORD: outlet_hq
          POSTGRES_DB: outlet_hq_test
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U outlet_hq -d outlet_hq_test"
          --health-interval 5s --health-timeout 3s --health-retries 20
    env:
      TEST_DATABASE_URL: postgres://outlet_hq:outlet_hq@localhost:5432/outlet_hq_test
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: backend/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npx prettier --check src test
      - run: npm test
      - run: npm run build

  web:
    name: Web (lint, types, tests, build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npx prettier --check src
      - run: npm test
      - run: npm run build

  e2e:
    name: End-to-end (docker compose + Playwright)
    # Pinned: Playwright installs browser dependencies only for the Ubuntu releases it supports, and ubuntu-latest
    # moved past them. Move this together with a Playwright upgrade.
    runs-on: ubuntu-24.04
    needs: [api, web]
    timeout-minutes: 20
    env:
      # Throwaway values for a stack that lives only for this job.
      POSTGRES_PASSWORD: e2e-only-password
      JWT_SECRET: e2e-only-secret-at-least-32-characters-long
      SEED_DEMO_DATA: 'true'
      # The suite signs in more often than the production limit of 10 a minute allows.
      LOGIN_RATE_LIMIT_PER_MINUTE: '1000'
      WEB_PORT: '8080'
      E2E_BASE_URL: http://localhost:8080
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: e2e/package-lock.json
      # Builds both production images, then waits until every service reports healthy.
      - run: docker compose up -d --build --wait --wait-timeout 180
      - run: npm ci
        working-directory: e2e
      - run: npm run typecheck
        working-directory: e2e
      - run: npx playwright install --with-deps chromium
        working-directory: e2e
      - run: npm test
        working-directory: e2e
      - if: failure()
        run: docker compose logs --no-color > compose.log
      - if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: e2e-report
          path: |
            e2e/playwright-report
            e2e/test-results
            compose.log
          retention-days: 7
      - if: always()
        run: docker compose down -v
